<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15122e">
  <title>¿Real o IA?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --fondo: #15122e;
      --panel: #221e42;
      --borde: #3a3566;
      --texto: #f3f1ff;
      --suave: #a9a4d0;
      --real: #0aa57f;
      --ia: #ee4b86;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: 'Bricolage Grotesque', Arial, sans-serif;
      background: var(--fondo);
      color: var(--texto);
    }

    button, select { touch-action: manipulation; }

    .oculto { display: none !important; }

    .pantalla { min-height: 100dvh; }
    .interior { max-width: 560px; margin: 0 auto; padding: 20px 16px; }

    h1 { font-size: 50px; line-height: 1; margin: 0 0 12px; font-weight: 800; letter-spacing: -0.02em; }
    h2 { font-size: 22px; line-height: 1.2; margin: 16px 0 12px; font-weight: 800; text-align: center; }
    p { font-size: 17px; line-height: 1.5; margin: 0 0 16px; color: var(--suave); }

    /* Botón principal */
    .boton {
      width: 100%;
      font: inherit;
      font-size: 19px;
      font-weight: 800;
      padding: 16px;
      color: var(--fondo);
      background: white;
      border: none;
      border-radius: 16px;
      cursor: pointer;
    }
    .boton:active { transform: scale(0.98); }
    .boton.oscuro { background: var(--fondo); color: white; }

    select {
      width: 100%;
      font: inherit;
      font-size: 17px;
      padding: 16px;
      color: var(--texto);
      background: var(--panel);
      border: 2px solid var(--borde);
      border-radius: 16px;
      margin-bottom: 14px;
    }

    /* Portada */
    #inicio .interior {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .venn { position: relative; height: 150px; margin-bottom: 28px; }
    .circulo {
      position: absolute;
      top: 0;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      mix-blend-mode: screen;
      display: flex;
      align-items: center;
      color: white;
      font-size: 30px;
      font-weight: 800;
    }
    .c-real { left: 0; background: var(--real); padding-left: 26px; }
    .c-ia { left: 90px; background: var(--ia); justify-content: flex-end; padding-right: 26px; }

    /* Barra de progreso y resultados */
    #progreso, #resultados { display: flex; gap: 6px; }
    #progreso span, #resultados span {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: var(--borde);
    }
    #progreso span.actual { background: var(--suave); }
    #progreso span.hecho, #resultados span.hecho { background: white; }

    /* Pantalla del contenido */
    #pantalla-item .interior { padding-bottom: 150px; }

    #contenido { text-align: center; }
    #contenido img, #contenido video {
      display: block;
      width: 100%;
      max-height: calc(100dvh - 300px);
      object-fit: contain;
      background: #000;
      border-radius: 18px;
    }
    #contenido img { cursor: zoom-in; }

    .caja-audio {
      padding: 36px 16px;
      background: var(--panel);
      border-radius: 18px;
    }
    .caja-audio p { margin-bottom: 16px; font-size: 20px; font-weight: 800; color: var(--texto); }
    .caja-audio audio { width: 100%; }

    #pista { text-align: center; font-size: 14px; margin: 10px 0 0; min-height: 20px; }

    /* Imagen ampliada */
    #ampliada {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 20;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #ampliada img { max-width: 100%; max-height: 100%; object-fit: contain; }

    /* Barra inferior con los dos botones */
    .barra {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 560px;
      margin: 0 auto;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: var(--fondo);
      border-top: 1px solid var(--borde);
    }
    #error {
      margin: 0 0 10px;
      padding: 10px 12px;
      font-size: 15px;
      font-weight: 700;
      color: white;
      background: var(--ia);
      border-radius: 12px;
    }
    #botones { display: flex; gap: 12px; }
    #botones button {
      flex: 1;
      height: 76px;
      font: inherit;
      font-size: 28px;
      font-weight: 800;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }
    #botones button:active { transform: scale(0.96); }
    #botones.enviando button { opacity: 0.35; }
    #botones.enviando button.elegido { opacity: 1; font-size: 22px; }
    .btn-real { background: var(--real); }
    .btn-ia { background: var(--ia); }

    /* Pantalla completa de resultado */
    .sobre {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
      overflow-y: auto;
    }
    .sobre.real { background: var(--real); }
    .sobre.ia { background: var(--ia); }
    .sobre-interior { width: 100%; max-width: 480px; margin: 0 auto; }

    .era { color: white; font-size: 24px; font-weight: 700; margin: 0; }
    .palabra {
      color: white;
      font-size: min(36vw, 180px);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.04em;
      margin: 0 0 24px;
      animation: pop 0.3s ease-out;
    }
    .tarjeta {
      background: white;
      border-radius: 24px;
      padding: 24px;
      animation: pop 0.3s ease-out;
    }
    .tarjeta p { color: var(--fondo); }
    #titulo-fb { font-size: 26px; font-weight: 800; margin-bottom: 8px; }
    #mensaje { margin-bottom: 20px; }

    /* Pantalla final */
    #final .interior {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    #puntaje { font-size: min(34vw, 150px); line-height: 0.95; letter-spacing: -0.04em; margin: 0 0 20px; }
    #resultados { margin: 8px 0 28px; }
    #resultados span { height: 12px; border-radius: 6px; }
    #comentario { color: var(--texto); font-size: 20px; font-weight: 700; }

    @keyframes pop {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .palabra, .tarjeta { animation: none; }
    }
  </style>
</head>
<body>

  <!-- Inicio -->
  <section id="inicio" class="pantalla">
    <div class="interior">
      <div class="venn">
        <div class="circulo c-real">Real</div>
        <div class="circulo c-ia">IA</div>
      </div>
      <h1>¿Real o IA?</h1>
      <p>Verás imágenes, videos y audios. Decide cuáles son reales y cuáles los creó una inteligencia artificial. Toma 2 minutos.</p>
      <select id="carrera">
        <option value="">Elige tu carrera</option>
        <optgroup label="Licenciaturas e Ingenierías">
          <option>Administración y Generación de Empresas</option>
          <option>Ingeniería en Sistemas Computacionales</option>
          <option>Ingeniería Agroindustrial</option>
          <option>Licenciatura en Comercio Internacional</option>
          <option>Licenciatura en Desarrollo Local</option>
        </optgroup>
        <optgroup label="Técnicos Universitarios">
          <option>Técnico en Administración de Empresas Cafetaleras</option>
          <option>Técnico Universitario en Producción Agrícola</option>
          <option>Técnico en Tecnología de Alimentos</option>
          <option>Tecnólogo en Agroexportaciones</option>
          <option>Técnico en Microfinanzas</option>
        </optgroup>
        <option>Otro (no soy estudiante)</option>
      </select>
      <button class="boton" onclick="empezar()">Empezar</button>
    </div>
  </section>

  <!-- Contenido a evaluar -->
  <section id="pantalla-item" class="pantalla oculto">
    <div class="interior">
      <div id="progreso"></div>
      <h2>¿Real o creado por IA?</h2>
      <div id="contenido"></div>
      <p id="pista"></p>
    </div>

    <div class="barra">
      <p id="error" class="oculto"></p>
      <div id="botones">
        <button class="btn-real" onclick="responder('Real', this)">Real</button>
        <button class="btn-ia" onclick="responder('IA', this)">IA</button>
      </div>
    </div>

    <div id="feedback" class="sobre oculto">
      <div class="sobre-interior">
        <p class="era">Era</p>
        <p class="palabra" id="palabra"></p>
        <div class="tarjeta">
          <p id="titulo-fb"></p>
          <p id="mensaje"></p>
          <button class="boton oscuro" id="btn-siguiente" onclick="siguiente()">Siguiente</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Final -->
  <section id="final" class="pantalla oculto">
    <div class="interior">
      <h1 id="puntaje"></h1>
      <div id="resultados"></div>
      <p id="comentario"></p>
      <p>Cuéntale a un compañero cómo te fue y reta a que lo intente.</p>
    </div>
  </section>

  <!-- Imagen en pantalla completa -->
  <div id="ampliada" class="oculto" onclick="cerrarAmpliada()">
    <img id="img-grande" alt="Imagen ampliada">
  </div>

  <script>
    // URL del Web App de Apps Script
    var URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbxuuIfD0gPeur-k4YYkz5zDF-UJMre2zIE0v02XE17zcwmQ5BWkP3yteoLzm2lWxB9f/exec';

    // Contenido del test (el id debe existir en CLAVE de Code.gs)
    var ITEMS = [
      { id: 1, tipo: 'imagen', archivo: 'media/img1.jpg' },
      { id: 2, tipo: 'imagen', archivo: 'media/img2.jpg' },
      { id: 3, tipo: 'video',  archivo: 'media/video1.mp4' },
      { id: 4, tipo: 'video',  archivo: 'media/video2.mp4' },
      // Cuando subas los audios, quita las // de estas dos líneas
      // { id: 5, tipo: 'audio',  archivo: 'media/audio1.mp3' },
      // { id: 6, tipo: 'audio',  archivo: 'media/audio2.mp3' }
    ];

    var sesion = 'S' + Date.now() + Math.floor(Math.random() * 1000);
    var carrera = '';
    var indice = 0;
    var aciertos = 0;
    var resultados = [];
    var inicioItem = 0;
    var enviando = false;

    // Muestra una sola pantalla
    function mostrar(id) {
      var pantallas = document.querySelectorAll('.pantalla');
      for (var i = 0; i < pantallas.length; i++) {
        pantallas[i].classList.add('oculto');
      }
      document.getElementById(id).classList.remove('oculto');
      window.scrollTo(0, 0);
    }

    function empezar() {
      carrera = document.getElementById('carrera').value;
      if (carrera === '') {
        alert('Elige tu carrera para continuar');
        return;
      }
      indice = 0;
      aciertos = 0;
      resultados = [];
      mostrarItem();
    }

    // Dibuja la barra de progreso
    function pintarProgreso() {
      var html = '';
      for (var i = 0; i < ITEMS.length; i++) {
        var clase = '';
        if (i < indice) {
          clase = 'hecho';
        } else if (i === indice) {
          clase = 'actual';
        }
        html += '<span class="' + clase + '"></span>';
      }
      document.getElementById('progreso').innerHTML = html;
    }

    // Deja los botones listos para responder
    function resetBotones() {
      enviando = false;
      var contenedor = document.getElementById('botones');
      contenedor.classList.remove('enviando');
      var botones = contenedor.querySelectorAll('button');
      botones[0].textContent = 'Real';
      botones[1].textContent = 'IA';
      botones[0].classList.remove('elegido');
      botones[1].classList.remove('elegido');
    }

    function mostrarItem() {
      var item = ITEMS[indice];
      var caja = document.getElementById('contenido');
      var pista = document.getElementById('pista');
      pista.textContent = '';

      if (item.tipo === 'imagen') {
        caja.innerHTML = '<img src="' + item.archivo + '" alt="Imagen a evaluar" onclick="ampliar(this.src)">';
        pista.textContent = 'Toca la imagen para verla más grande';
      } else if (item.tipo === 'video') {
        caja.innerHTML = '<video src="' + item.archivo + '" controls playsinline></video>';
      } else {
        caja.innerHTML = '<div class="caja-audio"><p>Escucha con atención</p>' +
          '<audio src="' + item.archivo + '" controls></audio></div>';
      }

      pintarProgreso();
      resetBotones();
      document.getElementById('feedback').className = 'sobre oculto';
      document.getElementById('error').classList.add('oculto');

      inicioItem = Date.now();
      mostrar('pantalla-item');
    }

    function ampliar(ruta) {
      document.getElementById('img-grande').src = ruta;
      document.getElementById('ampliada').classList.remove('oculto');
    }

    function cerrarAmpliada() {
      document.getElementById('ampliada').classList.add('oculto');
    }

    // Responde al instante y envía a Apps Script
    function responder(valor, boton) {
      if (enviando) {
        return;
      }
      enviando = true;
      document.getElementById('error').classList.add('oculto');
      document.getElementById('botones').classList.add('enviando');
      boton.classList.add('elegido');
      boton.textContent = 'Guardando…';

      var item = ITEMS[indice];
      var datos = {
        sesion: sesion,
        carrera: carrera,
        idItem: item.id,
        tipo: item.tipo,
        respuesta: valor,
        segundos: Math.round((Date.now() - inicioItem) / 1000)
      };
      enviar(datos, 1);
    }

    function enviar(datos, intento) {
      fetch(URL_SCRIPT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(datos)
      })
        .then(function (respuesta) {
          return respuesta.json();
        })
        .then(function (res) {
          if (res.ok) {
            mostrarResultado(res);
          } else {
            reintentar(datos, intento);
          }
        }, function () {
          reintentar(datos, intento);
        });
    }

    // Reintenta solo hasta 3 veces
    function reintentar(datos, intento) {
      if (intento < 3) {
        setTimeout(function () {
          enviar(datos, intento + 1);
        }, 1200);
        return;
      }
      resetBotones();
      var error = document.getElementById('error');
      error.textContent = 'No se pudo guardar. Revisa tu internet y toca de nuevo.';
      error.classList.remove('oculto');
    }

    function mostrarResultado(res) {
      var titulo = document.getElementById('titulo-fb');

      if (res.acierto) {
        aciertos++;
        titulo.textContent = '✓ ¡Acertaste!';
      } else {
        titulo.textContent = '✕ Esta vez no';
      }
      resultados.push(res.acierto);

      document.getElementById('palabra').textContent = res.real;
      document.getElementById('mensaje').textContent = res.explicacion;

      if (indice === ITEMS.length - 1) {
        document.getElementById('btn-siguiente').textContent = 'Ver resultado';
      } else {
        document.getElementById('btn-siguiente').textContent = 'Siguiente';
      }

      // El fondo toma el color de la respuesta correcta
      var color = (res.real === 'Real') ? 'real' : 'ia';
      document.getElementById('feedback').className = 'sobre ' + color;
    }

    function siguiente() {
      indice++;
      if (indice < ITEMS.length) {
        mostrarItem();
      } else {
        mostrarFinal();
      }
    }

    function mostrarFinal() {
      document.getElementById('puntaje').textContent = aciertos + '/' + ITEMS.length;

      var html = '';
      for (var i = 0; i < resultados.length; i++) {
        html += '<span class="' + (resultados[i] ? 'hecho' : '') + '"></span>';
      }
      document.getElementById('resultados').innerHTML = html;

      var comentario = document.getElementById('comentario');
      if (aciertos >= ITEMS.length * 0.7) {
        comentario.textContent = 'Buen ojo. Pero la IA mejora cada mes, así que no bajes la guardia.';
      } else {
        comentario.textContent = 'No eres el único. Hoy la IA es muy difícil de detectar, y por eso hicimos este test.';
      }
      mostrar('final');
    }
  </script>
</body>
</html>
